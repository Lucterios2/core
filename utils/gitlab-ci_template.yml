variables:
  EXTRA_PIP: X
  CLONE_LIST: X
  APPLICATION_TARGET: lucterios
  MANUAL_PATH: lucterios.pdf

stages:
  - check
  - test
  - build
  - integration

before_script:
  - if [ ! -d utils ]; then mkdir utils; wget --header "PRIVATE-TOKEN:${GITLAB_TOKEN}" https://gitlab.sleto.fr/api/v4/projects/1/repository/files/utils%2Fprep_env.sh/raw?ref=master -O utils/prep_env.sh; wget --header "PRIVATE-TOKEN:${GITLAB_TOKEN}" https://gitlab.sleto.fr/api/v4/projects/1/repository/files/utils%2Flib_build.xml/raw?ref=master -O utils/lib_build.xml; chmod +x utils/prep_env.sh; fi
  - ./utils/prep_env.sh debian
  - ./utils/prep_env.sh ant
  - ./utils/prep_env.sh requirement
  - ./utils/prep_env.sh install "${EXTRA_PIP}"
  - ./utils/prep_env.sh clone "${CLONE_LIST}"

check:
  image: python:3.9
  stage: check
  script:
    - ant clear init pep8 radon 
  artifacts:
    paths:
      - pep8_results.txt
      - pep8.svg
      - radon_results.txt
      - radon.svg
    expire_in: 1 month        

.test_basic:
  stage: test
  script:
    - ant clear init add_instance i18n docs tests
    - ./utils/prep_env.sh test
    - eval `ssh-agent -s`
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - export COV_PUBLISH_PATH="/var/www/public/coverage_${CI_PROJECT_ID}_${CI_JOB_NAME}"
    - ssh -o UserKnownHostsFile=/dev/null -o StrictHostKeyChecking=no chef@gitlab.sleto.fr "rm -rf ${COV_PUBLISH_PATH};mkdir -p ${COV_PUBLISH_PATH}"    
    - scp -o UserKnownHostsFile=/dev/null -o StrictHostKeyChecking=no -r htmlcov/* chef@gitlab.sleto.fr:${COV_PUBLISH_PATH}
  coverage: /\d+\%\s*$/    
  allow_failure: true
  artifacts:
    paths:
      - unittest.svg
      - ods/*.ods
      - pdf/*.pdf
      - htmlcov/
    reports:
      junit: 
        - junit_*.xml
      coverage_report:
        coverage_format: cobertura
        path: coverage3.xml
    expire_in: 1 month        

test38:
  extends: .test_basic
  image: python:3.8

test311:
  extends: .test_basic
  image: python:3.11
  
build:
  image: python:3.9
  stage: build
  script:
    - ant clear init add_instance i18n docs package
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - eval `ssh-agent -s`
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - scp -o UserKnownHostsFile=/dev/null -o StrictHostKeyChecking=no dist/*.whl sdlibre@pypi.lucterios.org:/home/sdlibre/scripts/packages_lucterios
  artifacts:
    paths:
      - dist/*.whl
      - ${MANUAL_PATH}
    expire_in: 1 month        

trigger_selenium38:
  stage: integration
  variables:
    TARGET: "${APPLICATION_TARGET}"
    PYTHON_VERSION: "3.8"
    BROWSER: chrome 
  allow_failure: true
  trigger:
    project: lucterios2/test-fct
    strategy: depend    

trigger_selenium311:
  stage: integration
  variables:
    TARGET: "${APPLICATION_TARGET}"
    PYTHON_VERSION: "3.11"
    BROWSER: chrome
  allow_failure: true
  trigger:
    project: lucterios2/test-fct
    strategy: depend    
