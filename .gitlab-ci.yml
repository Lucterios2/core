include:
  - project: 'lucterios2/lucterios'
    ref: master
    file: '/utils/gitlab-ci_template.yml'

before_script:
  - ./utils/prep_env.sh debian
  - ./utils/prep_env.sh ant
  - ./utils/prep_env.sh requirement
  - ./utils/prep_env.sh advanced
  - python3 -m pip install -U -r requirement.txt --extra-index-url https://pypi.diacamma.org/simple --extra-index-url https://pypi.lucterios.org/simple
  - python3 -m pip install -U lucterios.standard --extra-index-url https://pypi.diacamma.org/simple --extra-index-url https://pypi.lucterios.org/simple
  - python3 -m pip install opentypesvg
